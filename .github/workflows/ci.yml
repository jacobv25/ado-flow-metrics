name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # run the live eval on demand

jobs:
  unit:
    name: Unit (Vitest, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    name: End-to-end (Playwright, demo mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  eval:
    name: Eval (explain-this-week)
    needs: [unit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The live eval spends real API credit, so it only runs when something
      # that can change the model's output changed (or on manual dispatch).
      # Every other push runs the free harness self-test on the stub instead.
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            ai:
              - 'lib/explain.js'
              - 'evals/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run eval (live when the AI code changed and the key is present, otherwise the offline harness self-test)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_CHANGED: ${{ steps.changes.outputs.ai }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "No ANTHROPIC_API_KEY secret — running harness self-test on the stub"; npm run eval:stub
          elif [ "$AI_CHANGED" = "true" ] || [ "$MANUAL" = "true" ]; then
            npm run eval
          else
            echo "AI code unchanged — skipping the live eval to save credit; running harness self-test on the stub"; npm run eval:stub
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: evals/results/
          retention-days: 30
